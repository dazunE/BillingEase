<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tools for one of the three numbers</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&amp;family=DM+Sans:wght@400;500;600;700&amp;display=swap">
<style>
.be-tools{display:grid;gap:12px;grid-template-columns:repeat(3,minmax(0,1fr))}
@media (min-width:1000px){.be-tools-5{grid-template-columns:repeat(5,minmax(0,1fr))}.be-tools-4{grid-template-columns:repeat(4,minmax(0,1fr))}}
.be-tool{transition:border-color .15s ease,box-shadow .15s ease,transform .15s ease}
.be-tool:hover{border-color:#CBC7D3!important;box-shadow:0 6px 18px rgba(24,22,31,0.07);transform:translateY(-1px)}
.be-tool:focus-visible{outline:2px solid #7A5AF8;outline-offset:2px}
@media (max-width:620px){
  .be-tools{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .be-tools-5 .be-tool:last-child{grid-column:span 2}
  .be-tool{padding:14px!important;gap:8px!important}
  .be-tool-d{display:none!important}
}
@media (prefers-reduced-motion: reduce){.be-tool{transition:none}.be-tool:hover{transform:none}}
</style>
</helmet>
<!-- The tools behind one of the three numbers: one card per screen, each with a live status. area: in | out | keep -->
<section aria-labelledby="{{hid}}" style="display: flex; flex-direction: column; gap: 12px; font-family: DM Sans, system-ui, sans-serif; color: #18161F;">
  <div style="display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 12px;">
    <h2 id="{{hid}}" style="margin: 0; font-family: Sora, sans-serif; font-weight: 700; font-size: 22px; letter-spacing: -0.02em;">{{title}}</h2>
    <span style="font-size: 13px; color: #5F5B68;">{{note}}</span>
  </div>
  <nav aria-label="{{title}}" class="{{gridClass}}">
    <sc-for list="{{tools}}" as="t" hint-placeholder-count="6">
      <a class="be-tool" href="{{t.href}}" style="display: flex; flex-direction: column; gap: 10px; min-width: 0; padding: 16px 18px; border-radius: 20px; background: #FFFFFF; border: 1px solid #E2DFE8; color: #18161F; text-decoration: none;">
        <span style="display: flex; align-items: center; justify-content: space-between; gap: 8px;">
          <span style="width: 40px; height: 40px; border-radius: 12px; background: {{tint.bg}}; display: flex; align-items: center; justify-content: center; flex: none;">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="{{tint.fg}}" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{t.icon}}"></path></svg>
          </span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8A8594" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none;"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
        </span>
        <span style="display: flex; flex-direction: column; gap: 3px; min-width: 0;">
          <span style="font-weight: 700; font-size: 16px; line-height: 1.25;">{{t.name}}</span>
          <span class="be-tool-d" style="font-size: 13px; line-height: 1.4; color: #5F5B68;">{{t.desc}}</span>
        </span>
        <span style="margin-top: auto; display: flex; min-width: 0;">
          <sc-if value="{{t.pill}}" hint-placeholder-val="{{true}}">
            <span style="display: inline-flex; align-items: center; gap: 6px; max-width: 100%; box-sizing: border-box; padding: 3px 10px; border-radius: 10px; background: {{t.bg}}; color: {{t.fg}}; font-size: 12px; font-weight: 600; line-height: 1.35;"><span style="width: 6px; height: 6px; border-radius: 9999px; background: {{t.fg}}; flex: none;"></span><span style="min-width: 0;">{{t.status}}</span></span>
          </sc-if>
          <sc-if value="{{t.hint}}" hint-placeholder-val="{{false}}">
            <span style="font-size: 13px; line-height: 1.35; color: #5F5B68;">{{t.status}}</span>
          </sc-if>
        </span>
      </a>
    </sc-for>
  </nav>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"area":{"editor":"text","default":"keep"},"$preview":{"width":1200,"height":260}}'>
class Component extends DCLogic {
  renderVals() {
    const area = ['in', 'out', 'keep'].indexOf(this.props.area) >= 0 ? this.props.area : 'keep';
    const fn = (k) => typeof BE[k] === 'function';
    const W = (n) => BE.money(n, null, { whole: true });
    const plural = (n, one, many) => n + ' ' + (n === 1 ? one : (many || one + 's'));
    const t = BE.totals(typeof BE.homePeriod === 'function' ? BE.homePeriod() : 'month');
    const TONE = { attn: ['#FFF0B8', '#6B5000'], good: ['#E2F6D5', '#2F5711'], plain: ['#EFEDF3', '#47444F'] };
    // live: a status from the data (tone: attn | good | plain), or null for the plain hint.
    const tool = (href, name, desc, icon, live, hint) => {
      const on = live && live[0];
      const tone = TONE[(live && live[1]) || 'plain'];
      return { href, name, desc, icon, status: on ? live[0] : hint, pill: !!on, hint: !on, bg: tone[0], fg: tone[1] };
    };
    const I = {
      invoice: 'M7 3h7l5 5v13H7zM14 3v5h5M10 13h6M10 17h6',
      quote: 'M9 3h6v3H9zM7 4.5H5V21h14V4.5h-2M9 11h6M9 15h4',
      people: 'M16 20v-1a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4v1M9.5 11a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7M21 20v-1a4 4 0 0 0-3-3.8M16 4.2a3.5 3.5 0 0 1 0 6.6',
      repeat: 'M17 2l4 4-4 4M3 11V9a3 3 0 0 1 3-3h15M7 22l-4-4 4-4M21 13v2a3 3 0 0 1-3 3H3',
      box: 'M21 8 12 3 3 8v8l9 5 9-5zM3 8l9 5 9-5M12 13v8',
      card: 'M3 6h18v12H3zM3 10h18M7 15h3',
      receipt: 'M6 3h12v18l-3-2-3 2-3-2-3 2zM9 8h6M9 12h6M9 16h3',
      bill: 'M4 5h16v15H4zM4 10h16M9 3v4M15 3v4',
      cycle: 'M21 12a9 9 0 1 1-3-6.7M21 4v5h-5',
      team: 'M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1',
      shop: 'M3 9l2-5h14l2 5M4 9v11h16V9M3 9h18M9 20v-6h6v6',
      list: 'M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01',
      chart: 'M4 20V10M10 20V4M16 20v-7M2 20h20',
      percent: 'M19 5 5 19M7.5 9a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3M16.5 18a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3',
      bank: 'M3 10 12 4l9 6M5 10v8M19 10v8M9 10v8M15 10v8M3 20h18',
      folder: 'M3 6h7l2 2h9v11H3z',
      car: 'M5 16h14v-4l-2-5H7l-2 5zM5 16v2M19 16v2M7.5 13h.01M16.5 13h.01',
      home: 'M4 11 12 4l8 7v9h-5v-6H9v6H4z',
      cal: 'M4 5h16v15H4zM4 10h16M9 3v4M15 3v4'
    };
    let tools = [];
    const lk = BE.is('lk');
    const prof = BE.get('profile') || {};
    const pk = BE.pack();

    if (area === 'in') {
      const inv = BE.all('invoices').filter((i) => !i.void);
      const open = inv.filter((i) => !i.draft && BE.invOpen(i) > 0);
      const late = open.filter((i) => BE.invStatus(i) === 'late');
      const drafts = inv.filter((i) => i.draft).length;
      const quotes = BE.all('quotes');
      const waiting = quotes.filter((q) => q.state === 'waiting' || q.state === 'sent' || q.state === 'changes').length;
      const qDrafts = quotes.filter((q) => q.state === 'draft').length;
      const custs = BE.all('customers');
      const lateWho = {}; late.forEach((i) => { lateWho[i.who] = 1; });
      const nLateWho = Object.keys(lateWho).length;
      const rec = BE.all('recurring');
      const recOn = rec.filter((r) => !r.paused).length;
      const items = BE.all('products').length + BE.all('services').length;
      tools = [
        tool('SellInvoices.dc.html', lk && prof.vatRegistered ? 'Tax invoices' : 'Invoices', lk ? 'Every invoice, with VAT and SSCL' : 'Every invoice, sent, paid or late', I.invoice,
          open.length ? [open.length + ' unpaid' + (late.length ? ' · ' + late.length + ' late' : ''), late.length ? 'attn' : 'plain'] : (inv.length ? [drafts ? plural(drafts, 'draft') + ' · none unpaid' : 'All paid', drafts ? 'plain' : 'good'] : null),
          'Your first one shows here'),
        tool('SellQuotes.dc.html', 'Quotes', 'Price a job, mark it accepted', I.quote,
          waiting ? [waiting + ' waiting for an answer', 'plain'] : (qDrafts ? [plural(qDrafts, 'draft') + ' to send', 'attn'] : (quotes.length ? [plural(quotes.length, 'quote'), 'plain'] : null)),
          'Send one before you start'),
        tool('SellRecurring.dc.html', 'Repeating', 'Monthly drafts and money back', I.repeat,
          rec.length ? [recOn ? recOn + ' active' : 'All paused', 'plain'] : null,
          'For monthly retainers'),
        tool('SellCustomers.dc.html', 'Customers', 'Who you work for and what they owe', I.people,
          custs.length ? [plural(custs.length, 'customer') + (nLateWho ? ' · ' + nLateWho + ' late' : ''), nLateWho ? 'attn' : 'plain'] : null,
          'Add who you work for'),
        tool('SellCatalog.dc.html', 'Products and services', 'What you sell, with prices', I.box,
          items ? [plural(items, 'item'), 'plain'] : null,
          'Save your prices once')
      ];
    } else if (area === 'out') {
      const left = (b) => (fn('billLeft') ? BE.billLeft(b) : b.amount - (b.paid || 0));
      const bills = BE.all('bills');
      const openB = bills.filter((b) => left(b) > 0);
      const lateB = openB.filter((b) => b.dueIn != null && b.dueIn < 0).length;
      const mo = BE.all('monthly').filter((m) => m.active !== false);
      const vendors = BE.all('vendors');
      const exp = BE.all('expenses').filter((x) => x.inMonth);
      const uncat = BE.all('expenses').filter((x) => x.needsCat || x.uncategorised || !x.cat || /^(uncategori[sz]ed|needs a category)$/i.test(x.cat || '')).length;
      tools = [
        tool('SpendBill.dc.html', 'Bills', 'What you owe and when it’s due', I.bill,
          openB.length ? [openB.length + ' to pay · ' + W(openB.reduce((a, b) => a + left(b), 0)) + (lateB ? ' · ' + lateB + ' overdue' : ''), lateB ? 'attn' : 'plain'] : (bills.length ? ['All paid', 'good'] : null),
          'Enter one to pay later'),
        tool('SpendVendors.dc.html', 'Suppliers', 'Everyone you pay, and how much', I.shop,
          vendors.length ? [plural(vendors.length, 'supplier'), 'plain'] : null,
          'Added as you record costs'),
        tool('SpendEveryMonth.dc.html', 'Every month', lk ? 'Rent, electricity and internet' : 'Desk rent, software and phone', I.cycle,
          mo.length ? (t.outMonthly > 0 ? [W(t.outMonthly) + ' still to come', 'plain'] : ['All recorded this month', 'good']) : null,
          'Costs you set up to repeat'),
        tool('SpendTransaction.dc.html', 'Transactions', 'Each cost, its category and attachment', I.list,
          uncat ? [uncat + ' need' + (uncat === 1 ? 's' : '') + ' a category', 'attn'] : (exp.length ? [exp.length + ' this month', 'plain'] : null),
          'They appear as you record costs')
      ];
      if (!lk && pk.features && pk.features.mileage && (typeof BE.shows !== 'function' || BE.shows('mileage'))) {
        const trips = BE.all('trips').concat(BE.all('mileage'));
        const miles = trips.reduce((a, x) => a + (Number(x.miles) || 0), 0);
        tools.push(tool('Mileage.dc.html', 'Mileage', 'Business miles at 45p, then 25p', I.car,
          trips.length ? [plural(trips.length, 'trip') + (miles ? ' · ' + Math.round(miles) + ' miles' : ''), 'plain'] : null,
          'Log your first trip'));
      }
      if (!lk && (typeof BE.shows === 'function' ? BE.shows('landlord') : (prof.kind === 'both' || prof.kind === 'landlord'))) {
        const props = BE.all('properties');
        tools.push(tool('Properties.dc.html', 'Properties', 'Rent and costs, kept apart', I.home,
          props.length ? [plural(props.length, 'property', 'properties') + (props[0] && props[0].rent ? ' · ' + W(props.reduce((a, x) => a + (Number(x.rent) || 0), 0)) + ' rent a month' : ''), 'plain'] : null,
          'Add the property you let'));
      }
    } else {
      const hasData = !!(t.in || t.out);
      const bank = BE.get('bank');
      let bankLive = null;
      if (bank && bank.done) bankLive = [(bank.short || 'Last statement') + ' checked', 'good'];
      else if (bank && (bank.lines || []).length) {
        const cleared = (Number(bank.opening) || 0) + bank.lines.filter((l) => l.cleared).reduce((a, l) => a + l.amount, 0);
        const diff = Math.round((cleared - (Number(bank.ending) || 0)) * 100) / 100;
        bankLive = diff === 0 ? [(bank.short || 'Statement') + ' ready to finish', 'good'] : [W(Math.abs(diff)) + ' to check', 'attn'];
      }
      const nCats = (pk.categories || []).length;
      const reports = tool('BooksReports.dc.html', 'Reports', lk ? 'Profit and loss, VAT, SSCL and payroll' : 'Profit and loss, balance sheet', I.chart,
        hasData ? ['Profit ' + t.fmt.profit, 'plain'] : null, 'Fill in as you bill and spend');
      const cats = tool('BooksCategories.dc.html', 'Categories', lk ? 'Lines of the income tax return' : 'HMRC’s self-employment boxes', I.folder,
        nCats ? [plural(nCats, 'category', 'categories'), 'plain'] : null, 'A starter list for ' + (pk.short || 'you'));
      const bankT = tool('BooksReconcile.dc.html', 'Bank check', 'Tick a statement against your books', I.bank, bankLive, 'Import a statement (CSV)');
      if (lk) {
        const hm = fn('homeMonth') ? BE.homeMonth() : null;
        const per = hm && hm.period;
        const taxLive = !prof.vatRegistered ? null : per && per.due ? (hm.filed ? [per.label + ' filed', 'good'] : [per.label.split(' ')[0] + ' due ' + per.due.replace(/ 20\d\d$/, ''), hm.dueDays <= 10 ? 'attn' : 'plain']) : null;
        const payLive = hm && hm.hasPayroll ? (hm.run ? ['October · run by ' + hm.payDue, 'attn'] : hm.paidRun ? ['October paid', 'good'] : [plural(hm.people, 'person', 'people'), 'plain']) : null;
        tools = [
          tool('TaxPeriods.dc.html', 'Tax periods', 'VAT and SSCL, month by month', I.percent, taxLive, prof.vatRegistered ? 'Your first period shows here' : 'If you register for VAT'),
          tool('SpendPayroll.dc.html', 'Payroll', 'Payroll, EPF, ETF and APIT', I.team, payLive, 'Add employees when you hire'),
          reports, cats, bankT
        ];
      } else {
        const hq = fn('homeQuarter') ? BE.homeQuarter() : null;
        const qLive = hq && !hq.empty ? (hq.filed ? [hq.last.label + ' sent', 'good'] : hq.left ? [hq.last.label + ' · ' + plural(hq.left, 'check') + ' left', 'attn'] : [hq.last.label + ' ready to send', 'good']) : null;
        tools = [tool('Quarters.dc.html', 'Quarters', 'Making Tax Digital updates', I.cal, qLive, 'Q3 runs 6 Oct – 5 Jan')];
        if (prof.vatRegistered) tools.push(tool('TaxPeriods.dc.html', 'VAT summary', 'Per VAT quarter, for your accountant', I.percent, null, 'Totals for each VAT quarter'));
        const ukRuns = BE.all('payroll').filter((r) => r.kind !== 'due');
        const ukDue = BE.all('payroll').filter((r) => r.kind === 'due' && r.status !== 'paid');
        if (BE.all('employees').length || ukRuns.length) tools.push(tool('SpendPayroll.dc.html', 'Payroll records', 'Pay runs from your payroll software', I.team,
          ukDue.length ? [W(ukDue.reduce((a, d) => a + (Number(d.amount) || 0), 0)) + ' to pay by ' + ukDue[0].due, 'attn'] : (ukRuns.length ? [plural(ukRuns.length, 'pay run') + ' recorded', 'plain'] : null),
          'Enter runs from your software'));
        tools = tools.concat([reports, cats, bankT]);
      }
    }

    const HEAD = {
      in: ['Tools for Coming in', 'Invoices, quotes and customers'],
      out: ['Tools for Going out', lk ? 'Bills, suppliers and what you spend' : 'Bills, suppliers, mileage and your property'],
      keep: ['Your books', lk ? 'Tax periods, payroll and the reports your practitioner uses' : 'Quarters, reports and the checks your accountant asks for']
    }[area];
    const TINT = { in: { bg: '#EEE8FF', fg: '#18161F' }, out: { bg: '#FDE6D6', fg: '#18161F' }, keep: { bg: '#18161F', fg: '#B9A3FF' } }[area];
    return {
      tools, title: HEAD[0], note: HEAD[1], tint: TINT, hid: 'tools-' + area + '-h',
      gridClass: 'be-tools be-tools-' + tools.length
    };
  }
}
</script>
</body>
</html>
