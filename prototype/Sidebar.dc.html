<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>App sidebar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@600;700;800;900&amp;family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#163300}a:hover{color:#0e2100}
.be-mtoggle{display:none!important}
@media (max-width: 767px){
  .be-mtoggle{display:inline-flex!important}
  .be-nav-body{display:none!important}
  .be-nav.be-open .be-nav-body{display:flex!important}
  .be-nav{min-height:0!important;border-right:0!important;border-bottom:1px solid #E1E5DC}
}
</style>
</helmet>
<nav aria-label="Main" class="{{navClass}}" style="width: 100%; min-height: 100%; box-sizing: border-box; background: #FFFFFF; border-right: 1px solid #E1E5DC; padding: 20px 14px 24px; display: flex; flex-direction: column; gap: 18px; font-family: Inter, system-ui, sans-serif; color: #163300;">
  <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px;">
  <a href="Dashboard.dc.html" style="display: flex; align-items: center; gap: 10px; text-decoration: none; padding: 4px 8px;">
      <span style="width: 32px; height: 32px; border-radius: 10px; background: #9FE870; display: flex; align-items: center; justify-content: center;">
        <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 19 11 5h8l-6 14z" fill="#163300"></path></svg>
      </span>
      <span style="font-family: 'Inter Tight', Inter, sans-serif; font-weight: 800; font-size: 20px; letter-spacing: -0.02em; color: #163300;">BillingEase</span>
    </a>
    <button type="button" class="be-mtoggle" aria-expanded="{{navOpen}}" aria-controls="be-nav-body" onClick="{{toggleNav}}" style="align-items: center; gap: 8px; min-height: 44px; padding: 0 16px; border: 0; border-radius: 9999px; background: rgba(22,51,0,0.08); color: #163300; font: 600 14px Inter, sans-serif; cursor: pointer;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#163300" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="{{navIcon}}"></path></svg>
      {{navLabel}}
    </button>
  </div>
  <div id="be-nav-body" class="be-nav-body" style="display: flex; flex-direction: column; gap: 18px; flex: 1;">

  <div style="position: relative;">
    <button type="button" aria-haspopup="menu" aria-expanded="{{menuOpen}}" onClick="{{toggleMenu}}" style="display: flex; align-items: center; gap: 10px; width: 100%; min-height: 52px; padding: 8px 12px; border: 1px solid #E1E5DC; border-radius: 12px; background: #F7F8F5; font: inherit; color: #163300; text-align: left; cursor: pointer;">
      <span style="width: 32px; height: 32px; border-radius: 9999px; background: #163300; color: #9FE870; font-weight: 700; font-size: 13px; display: flex; align-items: center; justify-content: center;">NS</span>
      <span style="flex: 1; display: flex; flex-direction: column; min-width: 0;">
        <span style="font-weight: 600; font-size: 14px;">Northwind Studio</span>
        <span style="font-size: 12px; color: #5D605B;">Pro plan · USD</span>
      </span>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#163300" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m7 10 5 5 5-5"></path></svg>
    </button>
    <sc-if value="{{menuOpen}}" hint-placeholder-val="{{false}}">
      <div role="menu" style="position: absolute; top: calc(100% + 6px); left: 0; right: 0; z-index: 40; background: #FFFFFF; border: 1px solid #E1E5DC; border-radius: 14px; padding: 6px; box-shadow: 0 10px 30px rgba(22,51,0,0.14); display: flex; flex-direction: column; gap: 2px;">
        <div style="padding: 8px 10px 4px; font-size: 12px; font-weight: 600; color: #5D605B;">Your businesses</div>
        <button type="button" role="menuitem" onClick="{{closeMenu}}" style="display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 10px; border: 0; border-radius: 10px; background: #E2F6D5; color: #163300; font: 600 14px Inter, sans-serif; text-align: left; cursor: pointer;">
          <span style="flex: 1;">Northwind Studio</span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#163300" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 5 5 9-10"></path></svg>
        </button>
        <a href="Onboarding.dc.html" role="menuitem" style="display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 10px; border-radius: 10px; color: #163300; font-weight: 500; font-size: 14px; text-decoration: none;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#163300" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
          Add a business
        </a>
        <div style="height: 1px; background: #EEF0EB; margin: 4px 6px;"></div>
        <a href="SignIn.dc.html" role="menuitem" style="display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 10px; border-radius: 10px; color: #163300; font-weight: 500; font-size: 14px; text-decoration: none;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#163300" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"></path></svg>
          Sign out
        </a>
      </div>
    </sc-if>
  </div>

  <a href="InvoiceEditor.dc.html" style="display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; border-radius: 9999px; background: #9FE870; color: #163300; font-weight: 600; font-size: 15px; text-decoration: none;">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#163300" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
    Create new
  </a>

  <div style="display: flex; flex-direction: column; gap: 14px; flex: 1;">
    <sc-for list="{{groups}}" as="group" hint-placeholder-count="6">
      <div style="display: flex; flex-direction: column; gap: 2px;">
        <sc-if value="{{group.label}}" hint-placeholder-val="{{true}}">
          <div style="font-size: 12px; font-weight: 600; color: #5D605B; padding: 4px 12px;">{{group.label}}</div>
        </sc-if>
        <sc-for list="{{group.items}}" as="item" hint-placeholder-count="3">
          <sc-if value="{{item.active}}" hint-placeholder-val="{{false}}">
            <a href="{{item.href}}" aria-current="page" style="display: flex; align-items: center; gap: 12px; min-height: 40px; padding: 0 12px; border-radius: 9999px; background: #E2F6D5; color: #163300; font-weight: 700; font-size: 14px; text-decoration: none;">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#163300" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{item.icon}}"></path></svg>
              <span style="flex: 1;">{{item.label}}</span>
            </a>
          </sc-if>
          <sc-if value="{{item.inactive}}" hint-placeholder-val="{{true}}">
            <a href="{{item.href}}" style="display: flex; align-items: center; gap: 12px; min-height: 40px; padding: 0 12px; border-radius: 9999px; color: #454745; font-weight: 500; font-size: 14px; text-decoration: none;">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#454745" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{item.icon}}"></path></svg>
              <span style="flex: 1;">{{item.label}}</span>
              <sc-if value="{{item.badge}}" hint-placeholder-val="{{false}}">
                <span style="font-size: 12px; font-weight: 700; background: #163300; color: #9FE870; border-radius: 9999px; padding: 2px 8px;">{{item.badge}}</span>
              </sc-if>
            </a>
          </sc-if>
        </sc-for>
      </div>
    </sc-for>
  </div>

  <div style="background: #163300; color: #FFFFFF; border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 10px;">
    <div style="font-family: 'Inter Tight', Inter, sans-serif; font-weight: 800; font-size: 17px; letter-spacing: -0.01em; color: #9FE870;">Talk to an advisor</div>
    <div style="font-size: 13px; line-height: 1.45; color: #E2F6D5;">Bookkeeping, tax and payroll help from accounting experts.</div>
    <button type="button" onClick="{{bookCall}}" style="align-self: flex-start; display: inline-flex; align-items: center; min-height: 36px; padding: 0 14px; border: 0; border-radius: 9999px; background: #9FE870; color: #163300; font: 600 13px Inter, sans-serif; cursor: pointer;">Book a call</button>
  </div>

  <div style="display: flex; flex-direction: column; gap: 2px;">
    <button type="button" onClick="{{openSettings}}" style="width: 100%; border: 0; background: transparent; font: inherit; cursor: pointer; text-align: left; display: flex; align-items: center; gap: 12px; min-height: 40px; padding: 0 12px; border-radius: 9999px; color: #454745; font-weight: 500; font-size: 14px; text-decoration: none;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#454745" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z"></path><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"></path></svg>
      Settings
    </button>
    <button type="button" onClick="{{openIntegrations}}" style="width: 100%; border: 0; background: transparent; font: inherit; cursor: pointer; text-align: left; display: flex; align-items: center; gap: 12px; min-height: 40px; padding: 0 12px; border-radius: 9999px; color: #454745; font-weight: 500; font-size: 14px; text-decoration: none;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#454745" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 17h6M17 14v6"></path></svg>
      Integrations
    </button>
  </div>
  </div>
  <sc-if value="{{toast}}" hint-placeholder-val="{{false}}">
    <div role="status" aria-live="polite" style="position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 60; display: flex; align-items: center; gap: 10px; max-width: calc(100% - 32px); box-sizing: border-box; padding: 12px 20px 12px 14px; border-radius: 9999px; background: #163300; color: #FFFFFF; font: 600 14px Inter, sans-serif; box-shadow: 0 6px 20px rgba(22,51,0,0.22);">
      <span style="width: 24px; height: 24px; border-radius: 9999px; background: #9FE870; display: flex; align-items: center; justify-content: center; flex: none;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#163300" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 5 5 9-10"></path></svg></span>
      <span>{{toast}}</span>
    </div>
  </sc-if>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","default":"dashboard","options":["dashboard","invoices","estimates","payments","customers","products","bills","receipts","vendors","transactions","reconciliation","accounts","payroll","employees","taxes","reports"]},"$preview":{"width":248,"height":1180}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { menuOpen: false, navOpen: false, toast: null }; }
  notify(msg) { this.setState({ toast: msg, menuOpen: false }); clearTimeout(this._toastTimer); this._toastTimer = setTimeout(() => this.setState({ toast: null }), 2600); }
  renderVals() {
    const active = this.props.active ?? 'dashboard';
    const I = {
      dashboard: 'M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z',
      invoices: 'M14 3H6a1 1 0 0 0-1 1v16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8zM14 3v5h5M8 13h8M8 17h5',
      estimates: 'M9 3h6v3H9zM7 4.5H6a1 1 0 0 0-1 1V20a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V5.5a1 1 0 0 0-1-1h-1M9 12h6M9 16h4',
      payments: 'M3 6h18v12H3zM3 10h18M7 15h3',
      customers: 'M16 20v-1a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4v1M9.5 11a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7M21 20v-1a4 4 0 0 0-3-3.8M15.5 4.2a3.5 3.5 0 0 1 0 6.6',
      products: 'M21 8 12 3 3 8v8l9 5 9-5zM3 8l9 5 9-5M12 13v8',
      bills: 'M6 3h12v18l-3-2-3 2-3-2-3 2zM9 8h6M9 12h6',
      receipts: 'M4 8h3l2-3h6l2 3h3v11H4zM12 17a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7',
      vendors: 'M3 9l1.5-5h15L21 9M3 9v11h18V9M3 9h18M9 20v-6h6v6',
      transactions: 'M7 4v16M3 8l4-4 4 4M17 20V4M13 16l4 4 4-4',
      reconciliation: 'M4 4h16v16H4zM8 12l3 3 5-6',
      accounts: 'M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01',
      payroll: 'M12 3v18M16.5 7.5c0-1.9-2-3-4.5-3s-4.5 1.1-4.5 3 2 2.6 4.5 3 4.5 1.4 4.5 3.4-2 3-4.5 3-4.5-1.1-4.5-3',
      employees: 'M4 5h16v14H4zM9 11a2 2 0 1 0 0-4 2 2 0 0 0 0 4M6 16a3 3 0 0 1 6 0M14 9h4M14 13h4',
      taxes: 'M3 21h18M5 21V10M19 21V10M9.5 21V10M14.5 21V10M2 10l10-6 10 6z',
      reports: 'M4 20V10M10 20V4M16 20v-7M22 20H2'
    };
    const item = (key, label, href, badge) => ({ key, label, href, icon: I[key], badge: badge || false, active: key === active, inactive: key !== active });
    const groups = [
      { label: false, items: [item('dashboard', 'Dashboard', 'Dashboard.dc.html')] },
      { label: 'Sales & payments', items: [
        item('invoices', 'Invoices', 'Invoices.dc.html', '3'),
        item('estimates', 'Estimates', 'Estimates.dc.html'),
        item('payments', 'Payments', 'Payments.dc.html'),
        item('customers', 'Customers', 'Customers.dc.html'),
        item('products', 'Products & services', 'Products.dc.html')
      ] },
      { label: 'Purchases', items: [
        item('bills', 'Bills', 'Bills.dc.html'),
        item('receipts', 'Receipts', 'Receipts.dc.html'),
        item('vendors', 'Vendors', 'Vendors.dc.html')
      ] },
      { label: 'Accounting', items: [
        item('transactions', 'Transactions', 'Transactions.dc.html', '12'),
        item('reconciliation', 'Reconciliation', 'Reconciliation.dc.html'),
        item('accounts', 'Chart of accounts', 'ChartOfAccounts.dc.html')
      ] },
      { label: 'Payroll', items: [
        item('payroll', 'Run payroll', 'Payroll.dc.html'),
        item('employees', 'Employees', 'Employees.dc.html'),
        item('taxes', 'Tax filings', 'TaxFilings.dc.html')
      ] },
      { label: 'Insights', items: [item('reports', 'Reports', 'Reports.dc.html')] }
    ];
    return {
      groups,
      menuOpen: this.state.menuOpen,
      navOpen: this.state.navOpen,
      navClass: this.state.navOpen ? 'be-nav be-open' : 'be-nav',
      navLabel: this.state.navOpen ? 'Close' : 'Menu',
      navIcon: this.state.navOpen ? 'M6 6l12 12M18 6 6 18' : 'M4 7h16M4 12h16M4 17h16',
      toggleNav: () => this.setState({ navOpen: !this.state.navOpen }),
      toast: this.state.toast,
      toggleMenu: () => this.setState({ menuOpen: !this.state.menuOpen }),
      closeMenu: () => this.setState({ menuOpen: false }),
      bookCall: () => this.notify('Request sent. An advisor will email you within 1 business day.'),
      openSettings: () => this.notify('Settings isn\'t part of this prototype yet'),
      openIntegrations: () => this.notify('Integrations isn\'t part of this prototype yet')
    };
  }
}
</script>
</body>
</html>
