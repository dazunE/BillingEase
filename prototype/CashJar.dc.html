<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cash jar illustration</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&amp;family=DM+Sans:wght@400;500;600;700&amp;family=Caveat:wght@600;700&amp;display=swap">
<style>
body{margin:0}
@keyframes cj-coin{0%{transform:translate(0,-80px);opacity:0}12%{opacity:1}68%{transform:translate(0,92px);opacity:1}78%,100%{transform:translate(0,98px);opacity:0}}
@keyframes cj-bill{0%{transform:translate(0,-90px) rotate(-18deg);opacity:0}14%{opacity:1}72%{transform:translate(8px,84px) rotate(14deg);opacity:1}82%,100%{transform:translate(8px,90px) rotate(14deg);opacity:0}}
@keyframes cj-tax{0%,18%{transform:translate(0,0);opacity:0}26%{opacity:1;transform:translate(24px,-46px)}52%{transform:translate(110px,-34px)}78%{transform:translate(168px,128px);opacity:1}88%,100%{transform:translate(168px,134px);opacity:0}}
@keyframes cj-settle{0%,100%{transform:translateY(0)}6%{transform:translateY(3px)}12%{transform:translateY(0)}}
@keyframes cj-env{0%,76%{transform:rotate(0)}82%{transform:rotate(-5deg)}88%{transform:rotate(4deg)}94%,100%{transform:rotate(0)}}
@keyframes cj-glint{0%,60%{opacity:0}72%{opacity:.95}86%,100%{opacity:0}}
.cj-spin{transform-box:fill-box;transform-origin:center}
@media (prefers-reduced-motion: reduce){.cj *{animation:none!important}}
</style>
</helmet>
<svg class="cj" width="{{w}}" height="{{h}}" viewBox="{{viewBox}}" role="img" aria-label="{{alt}}" style="display: block; overflow: visible; max-width: 100%; height: auto;">
  <!-- shadows -->
  <ellipse cx="100" cy="256" rx="74" ry="8" fill="#18161F" opacity="0.10"></ellipse>
  <ellipse cx="267" cy="246" rx="48" ry="6" fill="#18161F" opacity="{{envShadow}}"></ellipse>

  <!-- glass back -->
  <path d="M58 46 H142 V58 C142 66 166 70 166 98 V214 C166 236 150 250 128 250 H72 C50 250 34 236 34 214 V98 C34 70 58 66 58 58 Z" fill="#F6F4FF" opacity="0.9"></path>

  <!-- what's inside: a pile of bills and coins -->
  <clipPath id="{{clipId}}">
    <path d="M58 46 H142 V58 C142 66 166 70 166 98 V214 C166 236 150 250 128 250 H72 C50 250 34 236 34 214 V98 C34 70 58 66 58 58 Z"></path>
  </clipPath>
  <g clip-path="url(#{{clipId}})">
    <g style="animation: cj-settle 2.6s ease-out infinite; animation-delay: 1.6s;">
      <g transform="translate(22 214) rotate(-6)"><rect width="96" height="46" rx="4" fill="#A9D8A1" stroke="#18161F" stroke-width="2"></rect><rect x="6" y="6" width="84" height="34" rx="2" fill="none" stroke="#4F7F49" stroke-width="1.3"></rect><circle cx="48" cy="23" r="11" fill="#D3EDCE" stroke="#4F7F49" stroke-width="1.3"></circle><text x="48" y="28" text-anchor="middle" font-family="Sora, sans-serif" font-size="14" font-weight="800" fill="#2F5711">$</text></g>
      <g transform="translate(86 206) rotate(8)"><rect width="96" height="46" rx="4" fill="#B6E0AE" stroke="#18161F" stroke-width="2"></rect><rect x="6" y="6" width="84" height="34" rx="2" fill="none" stroke="#4F7F49" stroke-width="1.3"></rect><circle cx="48" cy="23" r="11" fill="#D3EDCE" stroke="#4F7F49" stroke-width="1.3"></circle><text x="48" y="28" text-anchor="middle" font-family="Sora, sans-serif" font-size="14" font-weight="800" fill="#2F5711">$</text></g>
      <g transform="translate(30 186) rotate(4)"><rect width="96" height="46" rx="4" fill="#9FD197" stroke="#18161F" stroke-width="2"></rect><rect x="6" y="6" width="84" height="34" rx="2" fill="none" stroke="#4F7F49" stroke-width="1.3"></rect><circle cx="48" cy="23" r="11" fill="#D3EDCE" stroke="#4F7F49" stroke-width="1.3"></circle><text x="48" y="28" text-anchor="middle" font-family="Sora, sans-serif" font-size="14" font-weight="800" fill="#2F5711">$</text></g>
      <g transform="translate(78 176) rotate(-10)"><rect width="96" height="46" rx="4" fill="#B0DCA8" stroke="#18161F" stroke-width="2"></rect><rect x="6" y="6" width="84" height="34" rx="2" fill="none" stroke="#4F7F49" stroke-width="1.3"></rect><circle cx="48" cy="23" r="11" fill="#D3EDCE" stroke="#4F7F49" stroke-width="1.3"></circle><text x="48" y="28" text-anchor="middle" font-family="Sora, sans-serif" font-size="14" font-weight="800" fill="#2F5711">$</text></g>
      <g transform="translate(84 150) rotate(6)"><rect width="96" height="46" rx="4" fill="#A3D49B" stroke="#18161F" stroke-width="2"></rect><rect x="6" y="6" width="84" height="34" rx="2" fill="none" stroke="#4F7F49" stroke-width="1.3"></rect><circle cx="48" cy="23" r="11" fill="#D3EDCE" stroke="#4F7F49" stroke-width="1.3"></circle><text x="48" y="28" text-anchor="middle" font-family="Sora, sans-serif" font-size="14" font-weight="800" fill="#2F5711">$</text></g>
      <g transform="translate(20 156) rotate(-9)"><rect width="96" height="46" rx="4" fill="#B3DEAB" stroke="#18161F" stroke-width="2"></rect><rect x="6" y="6" width="84" height="34" rx="2" fill="none" stroke="#4F7F49" stroke-width="1.3"></rect><circle cx="48" cy="23" r="11" fill="#D3EDCE" stroke="#4F7F49" stroke-width="1.3"></circle><text x="48" y="28" text-anchor="middle" font-family="Sora, sans-serif" font-size="14" font-weight="800" fill="#2F5711">$</text></g>
      <g transform="translate(60 138) rotate(-3)"><rect width="96" height="46" rx="4" fill="#9DCF95" stroke="#18161F" stroke-width="2"></rect><rect x="6" y="6" width="84" height="34" rx="2" fill="none" stroke="#4F7F49" stroke-width="1.3"></rect><circle cx="48" cy="23" r="11" fill="#D3EDCE" stroke="#4F7F49" stroke-width="1.3"></circle><text x="48" y="28" text-anchor="middle" font-family="Sora, sans-serif" font-size="14" font-weight="800" fill="#2F5711">$</text></g>
      <g transform="translate(52 150)"><ellipse cx="0" cy="3" rx="13" ry="5.5" fill="#D99A12"></ellipse><ellipse cx="0" cy="0" rx="13" ry="5.5" fill="#FFC53D" stroke="#18161F" stroke-width="1.8"></ellipse></g>
      <g transform="translate(140 158)"><ellipse cx="0" cy="3" rx="13" ry="5.5" fill="#D99A12"></ellipse><ellipse cx="0" cy="0" rx="13" ry="5.5" fill="#FFC53D" stroke="#18161F" stroke-width="1.8"></ellipse></g>
      <g transform="translate(112 142)"><ellipse cx="0" cy="3" rx="13" ry="5.5" fill="#D99A12"></ellipse><ellipse cx="0" cy="0" rx="13" ry="5.5" fill="#FFC53D" stroke="#18161F" stroke-width="1.8"></ellipse><ellipse cx="0" cy="-5" rx="13" ry="5.5" fill="#FFD465" stroke="#18161F" stroke-width="1.8"></ellipse></g>
    </g>
  </g>

  <!-- paper label -->
  <g transform="rotate(-5 100 132)">
    <rect x="54" y="98" width="92" height="{{labelH}}" rx="6" fill="#FFF6E0" stroke="#18161F" stroke-width="2"></rect>
    <text x="100" y="124" text-anchor="middle" font-family="Caveat, cursive" font-size="24" font-weight="700" fill="#18161F">Yours</text>
    <text x="100" y="145" text-anchor="middle" font-family="Caveat, cursive" font-size="24" font-weight="700" fill="#18161F">to keep</text>
    <text x="100" y="163" text-anchor="middle" font-family="Sora, sans-serif" font-size="12" font-weight="700" fill="#5B3FD6">{{amount}}</text>
  </g>

  <!-- glass outline and shine -->
  <path d="M58 46 H142 V58 C142 66 166 70 166 98 V214 C166 236 150 250 128 250 H72 C50 250 34 236 34 214 V98 C34 70 58 66 58 58 Z" fill="none" stroke="{{line}}" stroke-width="3" stroke-linejoin="round"></path>
  <path d="M46 104 C46 90 52 82 60 78" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" opacity="0.9"></path>
  <path d="M44 120 V196" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" opacity="0.75"></path>
  <path d="M150 112 L156 104 M152 120 L160 112" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" style="animation: cj-glint 3.4s ease-in-out infinite;"></path>

  <!-- lid -->
  <rect x="52" y="20" width="96" height="26" rx="5" fill="#C4BFCE" stroke="{{line}}" stroke-width="2.5"></rect>
  <path d="M64 24 V42 M76 24 V42 M88 24 V42 M100 24 V42 M112 24 V42 M124 24 V42 M136 24 V42" stroke="#8D879B" stroke-width="2"></path>
  <rect x="48" y="42" width="104" height="9" rx="3" fill="#9E98AC" stroke="{{line}}" stroke-width="2"></rect>

  <!-- money dropping in -->
  <g transform="translate(96 40)"><g style="animation: cj-coin 2.6s ease-in infinite;"><ellipse cx="0" cy="3" rx="12" ry="5" fill="#D99A12"></ellipse><ellipse cx="0" cy="0" rx="12" ry="5" fill="#FFC53D" stroke="#18161F" stroke-width="1.8"></ellipse></g></g>
  <g transform="translate(78 36)"><g class="cj-spin" style="animation: cj-bill 3.4s ease-in-out infinite; animation-delay: 0.9s;"><rect width="58" height="28" rx="3" fill="#B6E0AE" stroke="#18161F" stroke-width="1.8"></rect><circle cx="29" cy="14" r="7" fill="#D3EDCE" stroke="#4F7F49" stroke-width="1.2"></circle><text x="29" y="18" text-anchor="middle" font-family="Sora, sans-serif" font-size="9" font-weight="800" fill="#2F5711">$</text></g></g>

  <g style="display: {{envDisplay}};">
    <!-- one in four coins hops into the tax envelope -->
    <g transform="translate(100 40)"><g style="animation: cj-tax 3.4s ease-in-out infinite; animation-delay: 1.7s;"><ellipse cx="0" cy="3" rx="11" ry="4.6" fill="#D99A12"></ellipse><ellipse cx="0" cy="0" rx="11" ry="4.6" fill="#FFC53D" stroke="#18161F" stroke-width="1.8"></ellipse></g></g>
    <g class="cj-spin" style="animation: cj-env 3.4s ease-in-out infinite; animation-delay: 1.7s;">
      <rect x="222" y="176" width="92" height="64" rx="6" fill="#E3C38F" stroke="{{line}}" stroke-width="2.5"></rect>
      <path d="M222 180 L268 212 L314 180" fill="#D3AC70" stroke="{{line}}" stroke-width="2.2" stroke-linejoin="round"></path>
      <text x="268" y="232" text-anchor="middle" font-family="Sora, sans-serif" font-size="14" font-weight="800" fill="#6B3E0E" letter-spacing="1.5">TAX</text>
      <circle cx="298" cy="196" r="11" fill="none" stroke="#A8200D" stroke-width="1.8"></circle>
      <text x="298" y="199" text-anchor="middle" font-family="Sora, sans-serif" font-size="7.5" font-weight="800" fill="#A8200D">{{taxPct}}</text>
    </g>
    <text x="268" y="266" text-anchor="middle" font-family="Caveat, cursive" font-size="20" font-weight="700" fill="{{line}}">set aside</text>
  </g>
</svg>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"size":{"editor":"int","default":260,"min":120,"max":600},"amount":{"editor":"text","default":"$8,407"},"envelope":{"editor":"boolean","default":true},"line":{"editor":"color","default":"#18161F","options":["#18161F","#EEE8FF"]},"taxPct":{"editor":"text","default":"25%"},"uid":{"editor":null,"default":"a"},"$preview":{"width":340,"height":300}}'>
class Component extends DCLogic {
  renderVals() {
    const env = this.props.envelope ?? true;
    const size = this.props.size ?? 260;
    const vbW = env ? 330 : 200;
    const amount = this.props.amount ?? '$8,407';
    return {
      w: size, h: Math.round(size * 275 / vbW),
      viewBox: '0 0 ' + vbW + ' 275',
      envDisplay: env ? 'inline' : 'none', envShadow: env ? 0.08 : 0,
      line: this.props.line ?? '#18161F',
      amount, labelH: amount ? 72 : 58,
      taxPct: this.props.taxPct ?? '25%',
      clipId: 'cj-clip-' + (this.props.uid ?? 'a'),
      alt: 'A jar of cash labelled “Yours to keep”' + (env ? ', with a tax envelope beside it' : '')
    };
  }
}
</script>
</body>
</html>
