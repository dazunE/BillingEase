<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Scan receipt</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&amp;family=DM+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#18161F}a:hover{color:#000000}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; background: #0E0C14; font-family: DM Sans, system-ui, sans-serif; color: #FFFFFF;">
  <header style="position: absolute; top: 0; left: 0; right: 0; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 16px;">
    <a href="MobileHome.dc.html" aria-label="Close scanner" style="width: 44px; height: 44px; border-radius: 9999px; background: rgba(255,255,255,0.14); display: flex; align-items: center; justify-content: center;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg>
    </a>
    <h1 style="margin: 0; font-family: Sora, DM Sans, sans-serif; font-weight: 800; font-size: 18px; letter-spacing: -0.02em;">Scan receipt</h1>
    <button type="button" onClick="{{toggleAuto}}" aria-pressed="{{autoPressed}}" style="display: inline-flex; align-items: center; gap: 6px; min-height: 32px; padding: 0 12px; border-radius: 9999px; border: 0; background: {{autoBg}}; color: {{autoFg}}; font: 700 12px DM Sans, sans-serif; cursor: pointer;">
      <span style="width: 6px; height: 6px; border-radius: 9999px; background: {{autoFg}};"></span>
      {{autoLabel}}
    </button>
  </header>

  <section aria-label="Camera viewfinder" style="position: absolute; top: 72px; left: 16px; right: 16px; height: 400px; border-radius: 24px; background: #18161F; display: flex; align-items: center; justify-content: center;">
    <div aria-hidden="true" style="position: relative; width: 210px; height: 320px;">
      <span style="position: absolute; top: -14px; left: -14px; width: 36px; height: 36px; border-top: 4px solid #B9A3FF; border-left: 4px solid #B9A3FF; border-top-left-radius: 14px;"></span>
      <span style="position: absolute; top: -14px; right: -14px; width: 36px; height: 36px; border-top: 4px solid #B9A3FF; border-right: 4px solid #B9A3FF; border-top-right-radius: 14px;"></span>
      <span style="position: absolute; bottom: -14px; left: -14px; width: 36px; height: 36px; border-bottom: 4px solid #B9A3FF; border-left: 4px solid #B9A3FF; border-bottom-left-radius: 14px;"></span>
      <span style="position: absolute; bottom: -14px; right: -14px; width: 36px; height: 36px; border-bottom: 4px solid #B9A3FF; border-right: 4px solid #B9A3FF; border-bottom-right-radius: 14px;"></span>
      <div style="width: 100%; height: 100%; box-sizing: border-box; background: #EFEDF3; border-radius: 6px; padding: 18px 16px; display: flex; flex-direction: column; gap: 9px; transform: rotate(-2deg);">
        <span style="height: 10px; width: 60%; align-self: center; border-radius: 9999px; background: #CBC7D3;"></span>
        <span style="height: 6px; width: 40%; align-self: center; border-radius: 9999px; background: #E2DFE8;"></span>
        <span style="height: 1px; background: #CBC7D3; margin: 6px 0;"></span>
        <span style="display: flex; justify-content: space-between;"><span style="height: 6px; width: 50%; border-radius: 9999px; background: #CBC7D3;"></span><span style="height: 6px; width: 18%; border-radius: 9999px; background: #CBC7D3;"></span></span>
        <span style="display: flex; justify-content: space-between;"><span style="height: 6px; width: 42%; border-radius: 9999px; background: #CBC7D3;"></span><span style="height: 6px; width: 16%; border-radius: 9999px; background: #CBC7D3;"></span></span>
        <span style="display: flex; justify-content: space-between;"><span style="height: 6px; width: 56%; border-radius: 9999px; background: #CBC7D3;"></span><span style="height: 6px; width: 18%; border-radius: 9999px; background: #CBC7D3;"></span></span>
        <span style="display: flex; justify-content: space-between;"><span style="height: 6px; width: 34%; border-radius: 9999px; background: #CBC7D3;"></span><span style="height: 6px; width: 14%; border-radius: 9999px; background: #CBC7D3;"></span></span>
        <span style="height: 1px; background: #CBC7D3; margin: 6px 0;"></span>
        <span style="display: flex; justify-content: space-between;"><span style="height: 8px; width: 30%; border-radius: 9999px; background: #5F5B68;"></span><span style="height: 8px; width: 24%; border-radius: 9999px; background: #5F5B68;"></span></span>
        <span style="margin-top: auto; height: 22px; width: 70%; align-self: center; border-left: 3px solid #CBC7D3; border-right: 3px solid #CBC7D3; box-sizing: border-box; display: flex; justify-content: space-evenly;"><span style="width: 2px; background: #CBC7D3;"></span><span style="width: 3px; background: #CBC7D3;"></span><span style="width: 1px; background: #CBC7D3;"></span><span style="width: 2px; background: #CBC7D3;"></span><span style="width: 3px; background: #CBC7D3;"></span><span style="width: 1px; background: #CBC7D3;"></span><span style="width: 2px; background: #CBC7D3;"></span></span>
      </div>
    </div>
    <div style="position: absolute; left: 0; right: 0; bottom: 14px; display: flex; justify-content: center;">
      <span style="display: inline-flex; align-items: center; gap: 6px; min-height: 28px; padding: 0 12px; border-radius: 9999px; background: rgba(14,12,20,0.72); color: #FFFFFF; font-size: 12px; font-weight: 600;" role="status">{{hint}}</span>
    </div>
  </section>

  <div style="position: absolute; top: 488px; left: 0; right: 0; display: flex; align-items: center; justify-content: space-around; padding: 0 40px;">
    <button type="button" onClick="{{gallery}}" aria-label="Choose from gallery" style="width: 48px; height: 48px; border-radius: 9999px; border: 0; background: rgba(255,255,255,0.14); display: flex; align-items: center; justify-content: center; cursor: pointer;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4h16v16H4zM4 16l5-5 4 4 3-3 4 4"></path><path d="M15.5 9a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3z"></path></svg>
    </button>
    <button type="button" onClick="{{capture}}" aria-label="Take photo" style="width: 76px; height: 76px; border-radius: 9999px; border: 4px solid #FFFFFF; background: #B9A3FF; box-sizing: border-box; display: flex; align-items: center; justify-content: center; cursor: pointer;">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#18161F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4zM12 17a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7"></path></svg>
    </button>
    <button type="button" onClick="{{toggleFlash}}" aria-label="Flash" aria-pressed="{{flashPressed}}" style="width: 48px; height: 48px; border-radius: 9999px; border: 0; background: {{flashBg}}; display: flex; align-items: center; justify-content: center; cursor: pointer;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="{{flashFg}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 2 4 14h7l-1 8 9-12h-7z"></path></svg>
    </button>
  </div>

  <section aria-labelledby="rs-title" style="position: absolute; left: 0; right: 0; bottom: 0; height: 252px; box-sizing: border-box; background: #FFFFFF; color: #18161F; border-radius: 24px 24px 0 0; padding: 10px 16px 24px; display: flex; flex-direction: column; gap: 8px;">
    <span aria-hidden="true" style="align-self: center; width: 40px; height: 4px; border-radius: 9999px; background: #CBC7D3;"></span>
    <div style="display: flex; justify-content: space-between; align-items: center; padding-top: 4px;">
      <h2 id="rs-title" style="margin: 0; font-family: Sora, DM Sans, sans-serif; font-weight: 800; font-size: 20px; letter-spacing: -0.02em;">Recent scans <span style="font-family: DM Sans, sans-serif; font-size: 13px; font-weight: 600; color: #5F5B68; letter-spacing: 0;">· {{scanCount}} today</span></h2>
      <a href="Receipts.dc.html" style="font-size: 13px; font-weight: 600;">View all</a>
    </div>
    <ul aria-live="polite" style="flex: 1; min-height: 0; overflow-y: auto; margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column;">
      <sc-for list="{{scans}}" as="s" hint-placeholder-count="2">
        <li style="flex: none; display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid #EFEDF2;">
          <span aria-hidden="true" style="flex: none; width: 40px; height: 52px; border-radius: 6px; background: #EFEDF3; border: 1px solid #E2DFE8; display: flex; flex-direction: column; justify-content: center; gap: 4px; padding: 0 7px; box-sizing: border-box;">
            <span style="height: 3px; border-radius: 9999px; background: #CBC7D3;"></span>
            <span style="height: 3px; width: 70%; border-radius: 9999px; background: #CBC7D3;"></span>
            <span style="height: 3px; border-radius: 9999px; background: #CBC7D3;"></span>
          </span>
          <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px;">
            <span style="font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{s.vendor}}</span>
            <span style="font-size: 12px; color: #5F5B68; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{s.meta}}</span>
          </span>
          <span style="flex: none; display: flex; flex-direction: column; align-items: flex-end; gap: 4px;">
            <span style="font-weight: 700; font-size: 14px; font-variant-numeric: tabular-nums;">{{s.amount}}</span>
            <span style="display: inline-flex; align-items: center; gap: 5px; padding: 2px 8px; border-radius: 9999px; font-size: 11px; font-weight: 700; background: {{s.bg}}; color: {{s.fg}};"><span style="width: 6px; height: 6px; border-radius: 9999px; background: {{s.fg}};"></span>{{s.status}}</span>
          </span>
        </li>
      </sc-for>
    </ul>
    <p style="flex: none; margin: 0; font-size: 12px; color: #5F5B68; overflow-wrap: anywhere;">Tip: forward receipts to receipts@northwind.billingease.com</p>
  </section>
<sc-if value="{{toast}}" hint-placeholder-val="{{false}}">
  <div role="status" aria-live="polite" style="pointer-events: none; position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); width: max-content; z-index: 60; display: flex; align-items: center; gap: 10px; max-width: calc(100% - 32px); box-sizing: border-box; padding: 12px 20px 12px 14px; border-radius: 9999px; background: #18161F; color: #FFFFFF; font: 600 14px DM Sans, sans-serif; box-shadow: 0 6px 20px rgba(24,22,31,0.22);">
    <span style="width: 24px; height: 24px; border-radius: 9999px; background: #B9A3FF; display: flex; align-items: center; justify-content: center; flex: none;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#18161F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 5 5 9-10"></path></svg></span>
    <span>{{toast}}</span>
  </div>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.nextId = 3;
    this.queue = [
      ['Figma', 'Software & subscriptions', '$45.00', 'Amex ••1009'],
      ['Local Print Shop', 'Printing', '$132.50', 'Chase ••4417'],
      ['Delta Air Lines', 'Travel', '$418.60', 'Amex ••1009'],
      ['Comcast Business', 'Utilities', '$129.99', 'Chase ••4417'],
      ['WeWork', 'Rent', '$650.00', 'Chase ••4417']
    ];
    this.state = {
      auto: true, flash: false, justCaptured: false, toast: null,
      scans: [
        { id: 1, processing: true, vendor: 'Reading receipt…', meta: 'Scanned just now · Office supplies?', amount: '—', result: ['Adobe Creative Cloud', 'Software & subscriptions', '$54.99', 'Amex ••1009'] },
        { id: 2, processing: false, vendor: 'Staples', meta: 'Oct 2 · Office supplies · Amex ••1009', amount: '$86.42' }
      ]
    };
    this.finishLater(1, 2600);
  }
  notify(msg) { this.setState({ toast: msg }); clearTimeout(this._toastTimer); this._toastTimer = setTimeout(() => this.setState({ toast: null }), 2600); }
  finishLater(id, ms) {
    setTimeout(() => {
      const scans = this.state.scans.map((x) => {
        if (x.id !== id || !x.processing) return x;
        const [vendor, cat, amount, card] = x.result;
        return { id: x.id, processing: false, vendor, meta: 'Oct 3 · ' + cat + ' · ' + card, amount };
      });
      this.setState({ scans });
    }, ms);
  }
  capture() {
    const id = this.nextId++;
    const result = this.queue[(id - 3) % this.queue.length];
    const scan = { id, processing: true, vendor: 'Reading receipt…', meta: 'Scanned just now · ' + result[1] + '?', amount: '—', result };
    this.setState({ scans: [scan].concat(this.state.scans), justCaptured: true });
    clearTimeout(this._capTimer);
    this._capTimer = setTimeout(() => this.setState({ justCaptured: false }), 1200);
    this.finishLater(id, 2200);
  }
  renderVals() {
    const { auto, flash, justCaptured } = this.state;
    const scans = this.state.scans.map((x) => ({
      vendor: x.vendor, meta: x.meta, amount: x.amount,
      status: x.processing ? 'Processing' : 'Ready',
      bg: x.processing ? '#E1EEF8' : '#E2F6D5',
      fg: x.processing ? '#1F5E91' : '#2F5711'
    }));
    return {
      scans,
      scanCount: this.state.scans.filter((x) => x.id !== 2).length,
      toast: this.state.toast,
      capture: () => this.capture(),
      gallery: () => this.notify('Photo library isn’t part of this prototype yet'),
      autoLabel: auto ? 'Auto-capture on' : 'Auto-capture off',
      autoPressed: auto ? 'true' : 'false',
      autoBg: auto ? '#B9A3FF' : 'rgba(255,255,255,0.14)',
      autoFg: auto ? '#18161F' : '#FFFFFF',
      toggleAuto: () => this.setState({ auto: !auto }),
      hint: justCaptured ? 'Captured · reading the details' : (auto ? 'Hold steady, capturing automatically' : 'Tap the shutter to capture'),
      flashPressed: flash ? 'true' : 'false',
      flashBg: flash ? '#B9A3FF' : 'rgba(255,255,255,0.14)',
      flashFg: flash ? '#18161F' : '#FFFFFF',
      toggleFlash: () => this.setState({ flash: !flash })
    };
  }
}
</script>
</body>
</html>
