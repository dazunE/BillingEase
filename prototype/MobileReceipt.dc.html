<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Scan receipt</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@600;700;800;900&amp;family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#163300}a:hover{color:#0e2100}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; background: #0F2400; font-family: Inter, system-ui, sans-serif; color: #FFFFFF;">
  <header style="position: absolute; top: 0; left: 0; right: 0; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 16px;">
    <a href="MobileHome.dc.html" aria-label="Close scanner" style="width: 44px; height: 44px; border-radius: 9999px; background: rgba(255,255,255,0.14); display: flex; align-items: center; justify-content: center;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg>
    </a>
    <h1 style="margin: 0; font-family: 'Inter Tight', Inter, sans-serif; font-weight: 800; font-size: 18px; letter-spacing: -0.02em;">Scan receipt</h1>
    <button type="button" onClick="{{toggleAuto}}" aria-pressed="{{autoPressed}}" style="display: inline-flex; align-items: center; gap: 6px; min-height: 32px; padding: 0 12px; border-radius: 9999px; border: 0; background: {{autoBg}}; color: {{autoFg}}; font: 700 12px Inter, sans-serif; cursor: pointer;">
      <span style="width: 6px; height: 6px; border-radius: 9999px; background: {{autoFg}};"></span>
      {{autoLabel}}
    </button>
  </header>

  <section aria-label="Camera viewfinder" style="position: absolute; top: 72px; left: 16px; right: 16px; height: 400px; border-radius: 24px; background: #163300; display: flex; align-items: center; justify-content: center;">
    <div aria-hidden="true" style="position: relative; width: 210px; height: 320px;">
      <span style="position: absolute; top: -14px; left: -14px; width: 36px; height: 36px; border-top: 4px solid #9FE870; border-left: 4px solid #9FE870; border-top-left-radius: 14px;"></span>
      <span style="position: absolute; top: -14px; right: -14px; width: 36px; height: 36px; border-top: 4px solid #9FE870; border-right: 4px solid #9FE870; border-top-right-radius: 14px;"></span>
      <span style="position: absolute; bottom: -14px; left: -14px; width: 36px; height: 36px; border-bottom: 4px solid #9FE870; border-left: 4px solid #9FE870; border-bottom-left-radius: 14px;"></span>
      <span style="position: absolute; bottom: -14px; right: -14px; width: 36px; height: 36px; border-bottom: 4px solid #9FE870; border-right: 4px solid #9FE870; border-bottom-right-radius: 14px;"></span>
      <div style="width: 100%; height: 100%; box-sizing: border-box; background: #F2F4EF; border-radius: 6px; padding: 18px 16px; display: flex; flex-direction: column; gap: 9px; transform: rotate(-2deg);">
        <span style="height: 10px; width: 60%; align-self: center; border-radius: 9999px; background: #C9CEC3;"></span>
        <span style="height: 6px; width: 40%; align-self: center; border-radius: 9999px; background: #E1E5DC;"></span>
        <span style="height: 1px; background: #C9CEC3; margin: 6px 0;"></span>
        <span style="display: flex; justify-content: space-between;"><span style="height: 6px; width: 50%; border-radius: 9999px; background: #C9CEC3;"></span><span style="height: 6px; width: 18%; border-radius: 9999px; background: #C9CEC3;"></span></span>
        <span style="display: flex; justify-content: space-between;"><span style="height: 6px; width: 42%; border-radius: 9999px; background: #C9CEC3;"></span><span style="height: 6px; width: 16%; border-radius: 9999px; background: #C9CEC3;"></span></span>
        <span style="display: flex; justify-content: space-between;"><span style="height: 6px; width: 56%; border-radius: 9999px; background: #C9CEC3;"></span><span style="height: 6px; width: 18%; border-radius: 9999px; background: #C9CEC3;"></span></span>
        <span style="display: flex; justify-content: space-between;"><span style="height: 6px; width: 34%; border-radius: 9999px; background: #C9CEC3;"></span><span style="height: 6px; width: 14%; border-radius: 9999px; background: #C9CEC3;"></span></span>
        <span style="height: 1px; background: #C9CEC3; margin: 6px 0;"></span>
        <span style="display: flex; justify-content: space-between;"><span style="height: 8px; width: 30%; border-radius: 9999px; background: #5D605B;"></span><span style="height: 8px; width: 24%; border-radius: 9999px; background: #5D605B;"></span></span>
        <span style="margin-top: auto; height: 22px; width: 70%; align-self: center; border-left: 3px solid #C9CEC3; border-right: 3px solid #C9CEC3; box-sizing: border-box; display: flex; justify-content: space-evenly;"><span style="width: 2px; background: #C9CEC3;"></span><span style="width: 3px; background: #C9CEC3;"></span><span style="width: 1px; background: #C9CEC3;"></span><span style="width: 2px; background: #C9CEC3;"></span><span style="width: 3px; background: #C9CEC3;"></span><span style="width: 1px; background: #C9CEC3;"></span><span style="width: 2px; background: #C9CEC3;"></span></span>
      </div>
    </div>
    <div style="position: absolute; left: 0; right: 0; bottom: 14px; display: flex; justify-content: center;">
      <span style="display: inline-flex; align-items: center; gap: 6px; min-height: 28px; padding: 0 12px; border-radius: 9999px; background: rgba(15,36,0,0.72); color: #FFFFFF; font-size: 12px; font-weight: 600;" role="status">{{hint}}</span>
    </div>
  </section>

  <div style="position: absolute; top: 488px; left: 0; right: 0; display: flex; align-items: center; justify-content: space-around; padding: 0 40px;">
    <button type="button" aria-label="Choose from gallery" style="width: 48px; height: 48px; border-radius: 9999px; border: 0; background: rgba(255,255,255,0.14); display: flex; align-items: center; justify-content: center; cursor: pointer;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4h16v16H4zM4 16l5-5 4 4 3-3 4 4"></path><path d="M15.5 9a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3z"></path></svg>
    </button>
    <button type="button" aria-label="Take photo" style="width: 76px; height: 76px; border-radius: 9999px; border: 4px solid #FFFFFF; background: #9FE870; box-sizing: border-box; display: flex; align-items: center; justify-content: center; cursor: pointer;">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#163300" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4zM12 17a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7"></path></svg>
    </button>
    <button type="button" onClick="{{toggleFlash}}" aria-label="Flash" aria-pressed="{{flashPressed}}" style="width: 48px; height: 48px; border-radius: 9999px; border: 0; background: {{flashBg}}; display: flex; align-items: center; justify-content: center; cursor: pointer;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="{{flashFg}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 2 4 14h7l-1 8 9-12h-7z"></path></svg>
    </button>
  </div>

  <section aria-labelledby="rs-title" style="position: absolute; left: 0; right: 0; bottom: 0; height: 252px; box-sizing: border-box; background: #FFFFFF; color: #163300; border-radius: 24px 24px 0 0; padding: 10px 16px 24px; display: flex; flex-direction: column; gap: 8px;">
    <span aria-hidden="true" style="align-self: center; width: 40px; height: 4px; border-radius: 9999px; background: #C9CEC3;"></span>
    <div style="display: flex; justify-content: space-between; align-items: center; padding-top: 4px;">
      <h2 id="rs-title" style="margin: 0; font-family: 'Inter Tight', Inter, sans-serif; font-weight: 800; font-size: 20px; letter-spacing: -0.02em;">Recent scans</h2>
      <a href="Receipts.dc.html" style="font-size: 13px; font-weight: 600;">View all</a>
    </div>
    <ul style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column;">
      <sc-for list="{{scans}}" as="s" hint-placeholder-count="2">
        <li style="display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid #EEF0EB;">
          <span aria-hidden="true" style="flex: none; width: 40px; height: 52px; border-radius: 6px; background: #F2F4EF; border: 1px solid #E1E5DC; display: flex; flex-direction: column; justify-content: center; gap: 4px; padding: 0 7px; box-sizing: border-box;">
            <span style="height: 3px; border-radius: 9999px; background: #C9CEC3;"></span>
            <span style="height: 3px; width: 70%; border-radius: 9999px; background: #C9CEC3;"></span>
            <span style="height: 3px; border-radius: 9999px; background: #C9CEC3;"></span>
          </span>
          <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px;">
            <span style="font-weight: 600; font-size: 14px;">{{s.vendor}}</span>
            <span style="font-size: 12px; color: #5D605B;">{{s.meta}}</span>
          </span>
          <span style="display: flex; flex-direction: column; align-items: flex-end; gap: 4px;">
            <span style="font-weight: 700; font-size: 14px; font-variant-numeric: tabular-nums;">{{s.amount}}</span>
            <span style="display: inline-flex; align-items: center; gap: 5px; padding: 2px 8px; border-radius: 9999px; font-size: 11px; font-weight: 700; background: {{s.bg}}; color: {{s.fg}};"><span style="width: 6px; height: 6px; border-radius: 9999px; background: {{s.fg}};"></span>{{s.status}}</span>
          </span>
        </li>
      </sc-for>
    </ul>
    <p style="margin: 0; font-size: 12px; color: #5D605B;">Tip: forward receipts to receipts@northwind.billingease.com</p>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { auto: true, flash: false }; }
  renderVals() {
    const { auto, flash } = this.state;
    const scans = [
      { vendor: 'Reading receipt…', meta: 'Scanned just now · Office supplies?', amount: '—', status: 'Processing', bg: '#E1EEF8', fg: '#1F5E91' },
      { vendor: 'Staples', meta: 'Oct 2 · Office supplies · Amex ••1009', amount: '$86.42', status: 'Ready', bg: '#E2F6D5', fg: '#2F5711' }
    ];
    return {
      scans,
      autoLabel: auto ? 'Auto-capture on' : 'Auto-capture off',
      autoPressed: auto ? 'true' : 'false',
      autoBg: auto ? '#9FE870' : 'rgba(255,255,255,0.14)',
      autoFg: auto ? '#163300' : '#FFFFFF',
      toggleAuto: () => this.setState({ auto: !auto }),
      hint: auto ? 'Hold steady, capturing automatically' : 'Tap the shutter to capture',
      flashPressed: flash ? 'true' : 'false',
      flashBg: flash ? '#9FE870' : 'rgba(255,255,255,0.14)',
      flashFg: flash ? '#163300' : '#FFFFFF',
      toggleFlash: () => this.setState({ flash: !flash })
    };
  }
}
</script>
</body>
</html>
