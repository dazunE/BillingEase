<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>App header</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&amp;family=DM+Sans:wght@400;500;600;700&amp;display=swap">
<style>
.be-hd-menu a:hover,.be-hd-menu button:hover{background:#F7F6F9}
.be-hd-res a:hover{background:#F7F6F9}
@media (max-width: 640px){.be-hd-newlbl{display:none}.be-hd-new{padding:0 12px!important}.be-hd-asklbl{display:none}.be-hd-ask{padding:0 12px!important}}
@media (max-width: 1100px){.be-hd-biz{display:none!important}}
.be-hd-ask:hover{background:#E2DFE8!important}
</style>
</helmet>
<!-- One header for every signed-in screen: search, New, notifications, your business. -->
<header style="background: #FFFFFF; border-bottom: 1px solid #E2DFE8; font-family: DM Sans, system-ui, sans-serif; color: #18161F;">
  <div style="max-width: 1200px; margin: 0 auto; box-sizing: border-box; padding: 12px clamp(16px, 4vw, 40px); display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px;">
    <a href="ThreeHome.dc.html" style="display: flex; align-items: center; gap: 10px; text-decoration: none; color: #18161F;">
      <svg width="32" height="32" viewBox="0 0 48 48" aria-hidden="true" style="flex: none; display: block;"><rect width="48" height="48" rx="13" fill="#18161F"></rect><rect x="9" y="11" width="30" height="7" rx="3.5" fill="#B9A3FF"></rect><rect x="22" y="20.5" width="17" height="7" rx="3.5" fill="#E0752D"></rect><rect x="9" y="30" width="13" height="7" rx="3.5" fill="#FFFFFF"></rect></svg>
      <span style="font-family: Sora, sans-serif; font-weight: 700; font-size: 19px; letter-spacing: -0.02em;">BillingEase</span>
    </a>
    <span class="be-hd-biz" style="display: flex; align-items: center; gap: 8px; min-width: 0; padding-left: 14px; border-left: 1px solid #E2DFE8; font-size: 14px; font-weight: 600; color: #47444F;">
      <span style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 200px;">{{p.business}}</span>
      <span title="{{countryName}}" style="flex: none; padding: 1px 8px; border-radius: 9999px; background: #EFEDF3; color: #18161F; font-size: 11.5px; font-weight: 700; line-height: 18px;">{{countryShort}}</span>
    </span>

    <div style="position: relative; flex: 1 1 260px; max-width: 480px; min-width: 0;">
      <label style="display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 16px; border-radius: 9999px; background: #EFEDF3;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#47444F" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M11 18a7 7 0 1 0 0-14 7 7 0 0 0 0 14zM20 20l-4-4"></path></svg>
        <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0);">Find anything</span>
        <input type="search" value="{{q}}" onChange="{{setQ}}" onKeyDown="{{searchKey}}" placeholder="{{searchHint}}" autocomplete="off" style="flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; font: 400 15px DM Sans, sans-serif; color: #18161F;">
        <sc-if value="{{hasQ}}" hint-placeholder-val="{{false}}">
          <button type="button" onClick="{{clearQ}}" aria-label="Clear search" style="width: 28px; height: 28px; border: 0; border-radius: 9999px; background: #E2DFE8; display: flex; align-items: center; justify-content: center; cursor: pointer; flex: none;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#18161F" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg></button>
        </sc-if>
      </label>
      <sc-if value="{{hasQ}}" hint-placeholder-val="{{false}}">
        <div class="be-hd-res" role="listbox" aria-label="Search results" style="position: absolute; left: 0; right: 0; top: calc(100% + 8px); z-index: 40; background: #FFFFFF; border: 1px solid #E2DFE8; border-radius: 18px; padding: 8px; box-shadow: 0 16px 40px rgba(24,22,31,0.16); display: flex; flex-direction: column; gap: 2px; max-height: 420px; overflow-y: auto;">
          <sc-for list="{{results}}" as="r" hint-placeholder-count="4">
            <a href="{{r.href}}" role="option" onClick="{{clearQ}}" style="display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 4px 12px; border-radius: 12px; text-decoration: none; color: #18161F;">
              <span style="flex: none; min-width: 74px; padding: 3px 8px; border-radius: 9999px; background: {{r.tint}}; font-size: 11.5px; font-weight: 700; text-align: center;">{{r.kind}}</span>
              <span style="display: flex; flex-direction: column; min-width: 0;">
                <span style="font-weight: 600; font-size: 14.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">{{r.title}}</span>
                <span style="font-size: 12.5px; color: #5F5B68; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">{{r.sub}}</span>
              </span>
            </a>
          </sc-for>
          <sc-if value="{{noResults}}" hint-placeholder-val="{{false}}">
            <p style="margin: 0; padding: 12px; font-size: 14px; color: #47444F;">Nothing matches “{{q}}”. {{noHint}}</p>
          </sc-if>
        </div>
      </sc-if>
    </div>

    <div style="display: flex; align-items: center; gap: 10px; margin-left: auto;">
      <a href="Ask.dc.html" class="be-hd-ask" aria-label="Ask: AI answers about tax and your books" style="display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 16px; border-radius: 9999px; background: #EFEDF3; color: #18161F; font: 600 15px DM Sans, sans-serif; text-decoration: none;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#18161F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l1.8 4.7L18.5 9.5l-4.7 1.8L12 16l-1.8-4.7L5.5 9.5l4.7-1.8zM19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z"></path></svg>
        <span class="be-hd-asklbl">Ask</span>
      </a>
      <div style="position: relative;">
        <button type="button" class="be-hd-new" aria-haspopup="menu" aria-expanded="{{newOpen}}" onClick="{{toggleNew}}" style="display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 20px; border: 0; border-radius: 9999px; background: #B9A3FF; color: #18161F; font: 600 15px DM Sans, sans-serif; cursor: pointer;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#18161F" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
          <span class="be-hd-newlbl">New</span>
        </button>
        <sc-if value="{{newOpen}}" hint-placeholder-val="{{false}}">
          <div class="be-hd-menu" role="menu" style="position: absolute; right: 0; top: calc(100% + 8px); z-index: 30; width: 280px; max-width: calc(100vw - 32px); background: #FFFFFF; border: 1px solid #E2DFE8; border-radius: 18px; padding: 8px; box-shadow: 0 16px 40px rgba(24,22,31,0.16); display: flex; flex-direction: column; gap: 2px;">
            <sc-for list="{{verbs}}" as="v" hint-placeholder-count="5">
              <a href="{{v.href}}" role="menuitem" onClick="{{closeMenus}}" style="display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 0 12px; border-radius: 12px; text-decoration: none; color: #18161F;">
                <span style="width: 34px; height: 34px; border-radius: 9999px; background: {{v.tint}}; display: flex; align-items: center; justify-content: center; flex: none;">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#18161F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{v.icon}}"></path></svg>
                </span>
                <span style="display: flex; flex-direction: column;">
                  <span style="font-weight: 600; font-size: 15px;">{{v.label}}</span>
                  <span style="font-size: 12px; color: #5F5B68;">{{v.hint}}</span>
                </span>
              </a>
            </sc-for>
          </div>
        </sc-if>
      </div>

      <a href="Notifications.dc.html" aria-label="{{bellLabel}}" style="position: relative; width: 44px; height: 44px; border-radius: 9999px; background: #EFEDF3; display: flex; align-items: center; justify-content: center; text-decoration: none; flex: none;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#18161F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9M10.3 21a1.94 1.94 0 0 0 3.4 0"></path></svg>
        <sc-if value="{{unread}}" hint-placeholder-val="{{false}}">
          <span aria-hidden="true" style="position: absolute; top: 2px; right: 0; min-width: 18px; height: 18px; padding: 0 5px; box-sizing: border-box; border-radius: 9999px; background: #E0752D; color: #FFFFFF; font: 700 11px DM Sans, sans-serif; display: flex; align-items: center; justify-content: center; border: 2px solid #FFFFFF;">{{unread}}</span>
        </sc-if>
      </a>

      <div style="position: relative;">
        <button type="button" aria-haspopup="menu" aria-expanded="{{acctOpen}}" aria-label="{{acctLabel}}" onClick="{{toggleAcct}}" style="width: 44px; height: 44px; border-radius: 9999px; border: 0; background: #18161F; color: #B9A3FF; font: 700 14px DM Sans, sans-serif; cursor: pointer;">{{p.initials}}</button>
        <sc-if value="{{acctOpen}}" hint-placeholder-val="{{false}}">
          <div class="be-hd-menu" role="menu" style="position: absolute; right: 0; top: calc(100% + 8px); z-index: 30; width: 280px; max-width: calc(100vw - 32px); max-height: calc(100vh - 90px); overflow-y: auto; box-sizing: border-box; background: #FFFFFF; border: 1px solid #E2DFE8; border-radius: 18px; padding: 8px; box-shadow: 0 16px 40px rgba(24,22,31,0.16); display: flex; flex-direction: column; gap: 2px;">
            <span style="display: flex; flex-direction: column; padding: 8px 12px 10px; border-bottom: 1px solid #EFEDF3; margin-bottom: 4px;"><span style="display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 15px;">{{p.business}}<span style="flex: none; padding: 1px 8px; border-radius: 9999px; background: #EFEDF3; font-size: 11.5px; font-weight: 700; line-height: 18px;">{{countryShort}}</span></span><span style="font-size: 13px; color: #5F5B68;">{{p.owner}} · {{p.role}}</span></span>
            <sc-for list="{{acct}}" as="ac" hint-placeholder-count="6">
              <a href="{{ac.href}}" role="menuitem" onClick="{{closeMenus}}" style="display: flex; flex-direction: column; justify-content: center; min-height: 48px; padding: 4px 12px; border-radius: 12px; text-decoration: none; color: #18161F;">
                <span style="font-weight: 600; font-size: 14px;">{{ac.label}}</span>
                <span style="font-size: 12px; color: #5F5B68;">{{ac.hint}}</span>
              </a>
            </sc-for>
            <span style="margin: 4px 12px 0; padding-top: 10px; border-top: 1px solid #EFEDF3; font-size: 11.5px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; color: #5F5B68;">Prototype only</span>
            <sc-for list="{{proto}}" as="pt" hint-placeholder-count="2">
              <a href="{{pt.href}}" role="menuitem" onClick="{{closeMenus}}" style="display: flex; flex-direction: column; justify-content: center; min-height: 48px; padding: 4px 12px; border-radius: 12px; text-decoration: none; color: #18161F;">
                <span style="font-weight: 600; font-size: 14px;">{{pt.label}}</span>
                <span style="font-size: 12px; color: #5F5B68;">{{pt.hint}}</span>
              </a>
            </sc-for>
          </div>
        </sc-if>
      </div>
    </div>
  </div>
  <sc-if value="{{flash}}" hint-placeholder-val="{{false}}">
    <div role="status" aria-live="polite" style="position: fixed; pointer-events: none; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 60; display: flex; align-items: center; gap: 10px; width: max-content; max-width: calc(100% - 32px); box-sizing: border-box; padding: 12px 20px 12px 14px; border-radius: 9999px; background: #18161F; color: #FFFFFF; font: 600 14px DM Sans, sans-serif; box-shadow: 0 12px 32px rgba(24,22,31,0.24);">
      <span style="width: 24px; height: 24px; border-radius: 9999px; background: #B9A3FF; display: flex; align-items: center; justify-content: center; flex: none;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#18161F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 5 5 9-10"></path></svg></span>
      <span>{{flash}}</span>
    </div>
  </sc-if>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":80}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    let flash = null;
    try { flash = sessionStorage.getItem('be.flash'); sessionStorage.removeItem('be.flash'); } catch (e) { flash = null; }
    this.state = { newOpen: false, acctOpen: false, q: '', flash };
    if (flash) this._t = setTimeout(() => this.setState({ flash: null }), 3200);
  }
  componentDidMount() {
    // Close menus on a click anywhere else, and on Escape.
    this._doc = (e) => {
      if (!this.state.newOpen && !this.state.acctOpen && !this.state.q) return;
      const host = this.__inst && this.__inst.host;
      if (host && !host.contains(e.target)) this.setState({ newOpen: false, acctOpen: false, q: '' });
    };
    this._esc = (e) => { if (e.key === 'Escape') this.setState({ newOpen: false, acctOpen: false, q: '' }); };
    document.addEventListener('click', this._doc);
    document.addEventListener('keydown', this._esc);
  }
  renderVals() {
    const st = this.state;
    const p = BE.get('profile') || {};
    const pk = BE.pack();
    const lk = BE.is('lk');
    const pr = typeof BE.practice === 'function' ? BE.practice() : { short: 'your accountant', noun: 'accountant', has: false };
    const q = st.q.trim().toLowerCase();
    const has = (s) => String(s || '').toLowerCase().indexOf(q) >= 0;
    const R = [];
    const IN = '#EEE8FF', OUT = '#FDE6D6', KEEP = '#EFEDF3';
    if (q) {
      BE.all('customers').forEach((c) => { if (has(c.name) || has(c.contact) || has(c.email)) R.push({ kind: 'Customer', tint: IN, title: c.name, sub: [c.contact, c.email].filter(Boolean).join(' · '), href: 'SellCustomer.dc.html#' + c.id }); });
      BE.all('invoices').forEach((i) => { if (has(i.num) || has(i.who) || has(i.what)) R.push({ kind: i.draft ? 'Draft' : 'Invoice', tint: IN, title: (i.draft ? 'Draft' : i.num) + ' · ' + i.who, sub: (i.what || '') + ' · ' + BE.money(BE.invTotal(i)), href: 'SellInvoices.dc.html#' + i.num }); });
      BE.all('quotes').forEach((x) => { if (has(x.num) || has(x.who) || has(x.title)) R.push({ kind: 'Quote', tint: IN, title: x.num + ' · ' + x.who, sub: x.title || '', href: 'SellQuote.dc.html#' + x.num }); });
      BE.all('vendors').forEach((v) => { if (has(v.name)) R.push({ kind: 'Supplier', tint: OUT, title: v.name, sub: v.cat || 'Supplier', href: 'SpendVendor.dc.html#' + v.id }); });
      BE.all('bills').forEach((b) => { if (b.status !== 'paid' && (has(b.who) || has(b.what) || has(b.num))) R.push({ kind: 'Bill', tint: OUT, title: b.who + ' · ' + BE.money(b.amount - (b.paid || 0)), sub: (b.what || '') + ' · due ' + b.due, href: 'SpendBill.dc.html#' + b.id }); });
      BE.all('expenses').forEach((x) => { if (has(x.who) || has(x.cat) || has(x.note)) R.push({ kind: 'Expense', tint: OUT, title: x.who + ' · ' + BE.money(x.amount), sub: [x.cat, x.date, x.how].filter(Boolean).join(' · '), href: 'SpendTransaction.dc.html#' + x.id }); });
      BE.all('products').concat(BE.all('services')).forEach((x) => { if (has(x.name)) R.push({ kind: 'Product', tint: IN, title: x.name, sub: BE.money(x.price), href: 'SellCatalog.dc.html' }); });
      BE.all('employees').forEach((e) => { if (has(e.name) || has(e.job)) R.push({ kind: 'Employee', tint: OUT, title: e.name, sub: [e.job, lk ? 'Payroll' : 'Payroll records'].filter(Boolean).join(' · '), href: 'SpendPayroll.dc.html' }); });
      BE.all('requests').forEach((r) => { if (has(r.title) || has(r.body)) R.push({ kind: (r.dir || 'in') === 'out' ? 'Question' : 'Request', tint: KEEP, title: r.title, sub: (r.status === 'done' ? 'Done' : 'Open') + ' · ' + pr.short, href: 'Accountant.dc.html' }); });
      if (!lk) {
        BE.all('properties').forEach((x) => { const nm = x.name || x.address || x.label || ''; if (has(nm) || has(x.address) || has(x.town)) R.push({ kind: 'Property', tint: OUT, title: nm, sub: [x.town, x.rent ? BE.money(x.rent) + ' a month' : ''].filter(Boolean).join(' · '), href: 'Properties.dc.html' + (x.id ? '#' + x.id : '') }); });
        BE.all('trips').concat(BE.all('mileage')).forEach((x) => { const nm = x.to || x.where || x.purpose || ''; if (has(nm) || has(x.purpose) || has(x.who)) R.push({ kind: 'Trip', tint: OUT, title: nm || 'Trip', sub: [x.date, x.miles ? x.miles + ' miles' : '', x.purpose].filter(Boolean).join(' · '), href: 'Mileage.dc.html' }); });
      }
      const PAGES = (lk ? [
        ['Tax periods', 'vat sscl tax period return ird output input', 'TaxPeriods.dc.html'],
        ['Payroll', 'payroll salary epf etf apit payslip employees', 'SpendPayroll.dc.html'],
        ['Your tax practitioner', 'practitioner accountant taxwise requests jayasinghe', 'Accountant.dc.html'],
        ['What your practitioner sees', 'practitioner taxwise.lk preview', 'PracticeView.dc.html']
      ] : [
        ['Quarters', 'mtd making tax digital quarter quarterly update hmrc', 'Quarters.dc.html'],
        ['VAT summary', 'vat return summary', 'TaxPeriods.dc.html'],
        ['Properties', 'property landlord rent flat mortgage letting', 'Properties.dc.html'],
        ['Mileage', 'mileage miles trips car van travel 45p', 'Mileage.dc.html'],
        ['Payroll records', 'payroll paye staff wages employee', 'SpendPayroll.dc.html'],
        ['Your accountant', 'accountant practice requests dale shaw', 'Accountant.dc.html'],
        ['What your accountant sees', 'practice workbench taxwise preview', 'PracticeView.dc.html']
      ]).concat([
        ['Ask', 'ask question ai answer tax help', 'Ask.dc.html'],
        ['Reports', 'report profit loss balance sheet', 'BooksReports.dc.html'],
        ['Check against your bank', 'reconcile bank statement csv import', 'BooksReconcile.dc.html'],
        ['Categories', 'categories chart of accounts journal entry', 'BooksCategories.dc.html'],
        ['Every month', 'repeating costs every month rent', 'SpendEveryMonth.dc.html'],
        ['Repeating invoices and money back', 'recurring retainer refund money back credit note', 'SellRecurring.dc.html'],
        ['Business profile', 'profile logo branding tax ' + (lk ? 'tin vat' : 'utr vat'), 'BizProfile.dc.html'],
        ['Security and your data', 'password security two-step export import delete', 'BizSecurity.dc.html'],
        ['Help', 'help support contact question', 'Help.dc.html']
      ]);
      PAGES.forEach((x) => { if (has(x[0]) || has(x[1])) R.push({ kind: 'Screen', tint: KEEP, title: x[0], sub: 'Go to ' + x[0].toLowerCase(), href: x[2] }); });
    }
    const results = R.slice(0, 8);
    const unread = BE.unread();
    const landlord = p.kind === 'both' || p.kind === 'landlord';
    const I = {
      invoice: 'M14 3H6a1 1 0 0 0-1 1v16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8zM14 3v5h5M8 13h8M8 17h5',
      expense: 'M6 3h12v18l-3-2-3 2-3-2-3 2zM9 8h6M9 12h6',
      home: 'M4 11 12 4l8 7v9h-5v-6H9v6H4z',
      car: 'M5 16h14v-4l-2-5H7l-2 5zM5 16v2M19 16v2M7.5 13h.01M16.5 13h.01',
      bill: 'M3 6h18v12H3zM3 10h18M7 15h3',
      people: 'M16 20v-1a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4v1M9.5 11a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7M21 20v-1a4 4 0 0 0-3-3.8'
    };
    const verbs = lk ? [
      { label: p.vatRegistered ? 'Send a tax invoice' : 'Send an invoice', hint: p.vatRegistered ? 'With VAT and SSCL on their own lines' : 'In rupees, in one sentence', href: 'ThreeIn.dc.html#bill', tint: IN, icon: I.invoice },
      { label: 'Record an expense', hint: 'Already paid: cash, card or transfer', href: 'ThreeOut.dc.html#expense', tint: OUT, icon: I.expense },
      { label: 'Enter a bill', hint: 'Something you’ll pay later', href: 'SpendBill.dc.html#new', tint: OUT, icon: I.bill },
      { label: 'Run payroll', hint: 'EPF, ETF and APIT worked out', href: 'SpendPayroll.dc.html', tint: OUT, icon: I.people }
    ] : [
      { label: 'Send an invoice', hint: 'In pounds, in one sentence', href: 'ThreeIn.dc.html#bill', tint: IN, icon: I.invoice },
      { label: 'Record an expense', hint: 'Already paid, in an HMRC category', href: 'ThreeOut.dc.html#expense', tint: OUT, icon: I.expense }
    ].concat(landlord ? [{ label: 'Add a property cost', hint: 'Repairs, agent fees, mortgage interest', href: 'Properties.dc.html#cost', tint: OUT, icon: I.home }] : []).concat([
      { label: 'Log a trip', hint: 'Business miles at 45p a mile', href: 'Mileage.dc.html#new', tint: OUT, icon: I.car },
      { label: 'Enter a bill', hint: 'Something you’ll pay later', href: 'SpendBill.dc.html#new', tint: OUT, icon: I.bill }
    ]);
    const other = lk ? 'uk' : 'lk';
    return {
      p, q: st.q, hasQ: !!q, results, noResults: !!q && results.length === 0,
      countryShort: pk.short || (lk ? 'Sri Lanka' : 'UK'), countryName: (pk.name || '') + ' business',
      searchHint: lk ? 'Find a customer, tax invoice, employee or report' : 'Find a customer, invoice, property or report',
      noHint: 'Try a customer, an invoice number like ' + (p.prefix || 'INV-') + '00' + (lk ? '12' : '45') + ', a supplier or a word like “' + (lk ? 'VAT' : 'mileage') + '”.',
      setQ: (e) => this.setState({ q: e.target.value, newOpen: false, acctOpen: false }),
      clearQ: () => this.setState({ q: '' }),
      searchKey: (e) => { if (e.key === 'Enter' && results[0]) { location.href = results[0].href; this.setState({ q: '' }); } },
      newOpen: st.newOpen, acctOpen: st.acctOpen,
      toggleNew: () => this.setState({ newOpen: !st.newOpen, acctOpen: false, q: '' }),
      toggleAcct: () => this.setState({ acctOpen: !st.acctOpen, newOpen: false, q: '' }),
      closeMenus: () => this.setState({ newOpen: false, acctOpen: false }),
      unread: unread || false,
      bellLabel: unread ? 'Notifications, ' + unread + ' new' : 'Notifications',
      acctLabel: 'Your business: ' + p.owner + ', ' + p.business,
      verbs,
      acct: [
        { label: 'Business profile', hint: lk ? 'Name, logo, TIN, VAT and SSCL' : 'Name, logo, UTR and VAT', href: 'BizProfile.dc.html' },
        { label: lk ? 'Your tax practitioner' : 'Your accountant', hint: pr.has ? pr.name : 'Link ' + (lk ? 'a practitioner or TaxWise.lk' : 'your accountant'), href: 'Accountant.dc.html' },
        { label: 'Security and your data', hint: 'Sign-in, import, export', href: 'BizSecurity.dc.html' },
        { label: 'Everything BillingEase does', hint: 'Every feature in plain words', href: 'Everything.dc.html' },
        { label: 'Help', hint: 'Answers, and talk to a person', href: 'Help.dc.html' },
        { label: 'Sign out', hint: p.email || 'Leave this device', href: 'AuthSignIn.dc.html#signedout' }
      ],
      proto: [
        { label: other === 'lk' ? 'Switch to the Sri Lanka sample' : 'Switch to the UK sample', hint: other === 'lk' ? 'Serendib Design Studio, Colombo' : 'Harper Studio, Leeds', href: 'ThreeHome.dc.html#sample-' + other },
        { label: 'Reset sample data', hint: 'Back to ' + (lk ? 'Serendib Design Studio' : 'Harper Studio') + ' on 11 October', href: 'ThreeHome.dc.html#reset' }
      ],
      flash: st.flash
    };
  }
}
</script>
