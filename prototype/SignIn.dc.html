<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sign in</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@600;700;800;900&amp;family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#163300}a:hover{color:#0e2100}
</style>
</helmet>
<div style="min-height: 100vh; box-sizing: border-box; background: #F7F8F5; font-family: Inter, system-ui, sans-serif; color: #163300; display: flex; flex-direction: column; padding: 28px 32px 40px; gap: 32px;">
  <header style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px;">
    <a href="Main.dc.html" style="display: flex; align-items: center; gap: 10px; text-decoration: none;">
      <span style="width: 32px; height: 32px; border-radius: 10px; background: #9FE870; display: flex; align-items: center; justify-content: center;">
        <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 19 11 5h8l-6 14z" fill="#163300"></path></svg>
      </span>
      <span style="font-family: 'Inter Tight', Inter, sans-serif; font-weight: 800; font-size: 20px; letter-spacing: -0.02em; color: #163300;">BillingEase</span>
    </a>
    <span style="font-size: 14px; color: #454745;">New to BillingEase? <a href="SignUp.dc.html" style="font-weight: 600;">Create an account</a></span>
  </header>

  <main style="flex: 1; display: flex; align-items: center; justify-content: center;">
    <div style="width: 100%; max-width: 460px; box-sizing: border-box; background: #FFFFFF; border: 1px solid #E1E5DC; border-radius: 24px; padding: 40px; display: flex; flex-direction: column; gap: 20px;">
      <div style="display: flex; flex-direction: column; gap: 8px;">
        <h1 style="margin: 0; font-family: 'Inter Tight', Inter, sans-serif; font-weight: 900; font-size: 56px; line-height: 1.0; letter-spacing: -0.035em;">Welcome back.</h1>
        <p style="margin: 0; font-size: 15px; color: #454745;">Sign in to manage invoices, payments and your books.</p>
      </div>

      <div style="display: flex; flex-direction: column; gap: 6px;">
        <label for="si-email" style="font-size: 13px; font-weight: 600;">Email</label>
        <input id="si-email" type="email" autocomplete="email" value="maya@northwindstudio.com" style="min-height: 44px; box-sizing: border-box; padding: 0 14px; border: 1px solid #C9CEC3; border-radius: 10px; background: #FFFFFF; font: 400 15px Inter, sans-serif; color: #163300;">
      </div>

      <div style="display: flex; flex-direction: column; gap: 6px;">
        <div style="display: flex; justify-content: space-between; align-items: baseline; gap: 12px;">
          <label for="si-pass" style="font-size: 13px; font-weight: 600;">Password</label>
          <a href="#reset" style="font-size: 13px; font-weight: 600;">Forgot password?</a>
        </div>
        <div style="display: flex; align-items: center; min-height: 44px; box-sizing: border-box; border: 1px solid #C9CEC3; border-radius: 10px; background: #FFFFFF; padding: 0 4px 0 14px;">
          <input id="si-pass" type="{{pwType}}" autocomplete="current-password" value="Northwind-2026" style="flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; font: 400 15px Inter, sans-serif; color: #163300;">
          <button type="button" onClick="{{togglePw}}" aria-pressed="{{pwShown}}" style="min-height: 36px; padding: 0 12px; border-radius: 9999px; border: 0; background: transparent; color: #163300; font: 600 13px Inter, sans-serif; text-decoration: underline; cursor: pointer;">{{pwLabel}}</button>
        </div>
      </div>

      <label style="display: flex; align-items: center; gap: 10px; font-size: 14px; color: #454745; cursor: pointer;">
        <input type="checkbox" style="width: 18px; height: 18px; margin: 0; accent-color: #163300;">
        Keep me signed in on this device
      </label>

      <a href="Dashboard.dc.html" style="display: flex; align-items: center; justify-content: center; min-height: 48px; border-radius: 9999px; background: #9FE870; color: #163300; font-weight: 600; font-size: 15px; text-decoration: none;">Sign in</a>

      <div style="display: flex; align-items: center; gap: 12px; font-size: 13px; color: #5D605B;">
        <span style="flex: 1; height: 1px; background: #E1E5DC;"></span>or<span style="flex: 1; height: 1px; background: #E1E5DC;"></span>
      </div>

      <div style="display: flex; flex-direction: column; gap: 10px;">
        <button type="button" style="display: flex; align-items: center; justify-content: center; gap: 10px; min-height: 48px; border-radius: 9999px; border: 1px solid #163300; background: #FFFFFF; color: #163300; font: 600 15px Inter, sans-serif; cursor: pointer;">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#163300" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M20.5 12.2c0-.6-.1-1.2-.2-1.7H12v3.3h4.8a4.2 4.2 0 0 1-1.8 2.7"></path><path d="M15 16.5a6.9 6.9 0 0 1-3 .9 5.5 5.5 0 0 1-5.2-3.7"></path><path d="M6.8 13.7a5.6 5.6 0 0 1 0-3.4"></path><path d="M6.8 10.3A5.5 5.5 0 0 1 12 6.6c1.4 0 2.6.5 3.6 1.4"></path></svg>
          Continue with Google
        </button>
        <button type="button" style="display: flex; align-items: center; justify-content: center; gap: 10px; min-height: 48px; border-radius: 9999px; border: 0; background: rgba(22,51,0,0.08); color: #163300; font: 600 15px Inter, sans-serif; cursor: pointer;">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#163300" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM2 21v-1a6 6 0 0 1 9.5-4.9"></path><path d="M18 14a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5zM18 14v7M18 18h2"></path></svg>
          Sign in with a passkey
        </button>
      </div>

      <p style="margin: 0; font-size: 14px; color: #454745; text-align: center;">Don&#39;t have an account? <a href="SignUp.dc.html" style="font-weight: 600;">Sign up free</a></p>
    </div>
  </main>

  <footer style="display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; font-size: 13px; color: #5D605B;">
    <a href="#privacy" style="color: #454745;">Privacy</a>
    <a href="#terms" style="color: #454745;">Terms</a>
    <a href="#help" style="color: #454745;">Help center</a>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { showPw: false }; }
  renderVals() {
    const showPw = this.state.showPw;
    return {
      pwType: showPw ? 'text' : 'password',
      pwLabel: showPw ? 'Hide' : 'Show',
      pwShown: showPw ? 'true' : 'false',
      togglePw: () => this.setState({ showPw: !showPw })
    };
  }
}
</script>
</body>
</html>
