# Runs BillingEase with PostgreSQL: docker compose up --build, then open http://localhost:3000
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: billingease
      POSTGRES_PASSWORD: billingease
      POSTGRES_DB: billingease
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U billingease"]
      interval: 5s
      retries: 10

  api:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    depends_on:
      db: { condition: service_healthy }
    environment:
      DATABASE_URL: postgres://billingease:billingease@db:5432/billingease
      APP_URL: ${APP_URL:-http://localhost:3000}
      API_INTERNAL_KEY: ${API_INTERNAL_KEY:-change-me-in-production}
      POSTMARK_TOKEN: ${POSTMARK_TOKEN:-}
      EMAIL_FROM: ${EMAIL_FROM:-BillingEase <hello@example.com>}
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:-}
      GOOGLE_CLOUD_LOCATION: ${GOOGLE_CLOUD_LOCATION:-europe-west2}
      # A service account key mounted below (or workload identity where hosted).
      GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS:+/run/secrets/gcp.json}
      AI_MODEL_DEEP: ${AI_MODEL_DEEP:-gemini-4-argon}
      AI_MODEL_FAST: ${AI_MODEL_FAST:-gemini-3.8-flash}
      AI_MODEL_LITE: ${AI_MODEL_LITE:-gemini-3.5-flash-lite}
      AI_MONTHLY_BUDGET_USD: ${AI_MONTHLY_BUDGET_USD:-5}
      API_DAILY_QUOTA: ${API_DAILY_QUOTA:-5000}
      API_RATE_PER_MINUTE: ${API_RATE_PER_MINUTE:-120}
      BILLINGEASE_TODAY: ${BILLINGEASE_TODAY:-}
    volumes:
      - files:/data/files
      - ${GOOGLE_APPLICATION_CREDENTIALS:-/dev/null}:/run/secrets/gcp.json:ro
    # Not published: only the web app talks to the API. Outside apps reach /v1, /mcp and
    # /oauth through the web app's address, which forwards them.
    expose: ["4000"]

  web:
    build: { context: ., dockerfile: apps/web/Dockerfile }
    depends_on: [api]
    environment:
      API_URL: http://api:4000
      API_INTERNAL_KEY: ${API_INTERNAL_KEY:-change-me-in-production}
    ports:
      - "3000:3000"

volumes:
  pgdata:
  files:
